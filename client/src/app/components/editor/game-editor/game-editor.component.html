@defer {
<div class="game-editor">
    <div class="left-side">
        <app-toolbox [resetSignal]="resetToolboxFlag" [board]="board" (mapGenerated)="onMapGenerated()" (restartConfirmed)="onRestartConfirmed()"></app-toolbox>
    </div>
    <div class="right-side">
        <app-board [board]="board" mode="edit"></app-board>
    </div>
</div>
} @placeholder {
    <app-loading-screen></app-loading-screen>
}

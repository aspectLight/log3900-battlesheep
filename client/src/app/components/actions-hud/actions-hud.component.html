<div class="container">
    <div class="cards-container">
        @for (playerCard of playerCardList; track playerCard.player.id; let idx = $index) {
            <div class="card" (click)="toggleCard(idx)" [class.active]="playerCard.isActive" [class.isDisconnected]="playerCard.isDisconnected" [class.virtual-player]="playerCard.player.isVirtual" [attr.data-team]="playerCard.playerTeam">
                <div class="card-content">
                    <p class="action-wins"> {{playerCard.player.fightsWon}} </p>
                    @if (playerCard.isActive) {
                        
                        <p class="action-description" > Joue... </p>

                    }
                    @if (playerCard.isHost) {
                        <img class="host-img" src="./assets/ui/host.png">
                    }
                    @if(playerCard.player.isVirtual) {
                        <div class="virtual-badge">Virtuel</div>
                    }
                    <div class="player-circle" [ngStyle]="{'background-color': playerCard.playerColor}"></div>
                    @if (playerCard.hasFlag) {
                        <img src="/assets/items/flag.png" alt="Drapeau" class="flag-icon">
                    }
                    <div class="card-name">
                        {{ playerCard.player.name }}
                        <!-- @if (playerCard.playerTeam) {
                            <br>Équipe: {{playerCard.playerTeam}}
                        } -->
                    </div>
                    <div class="card-image">
                        <img [src]="playerCard.player.avatar?.avatar" alt="Card Image">
                    </div>     
                </div>
            </div>
        }
    </div>
</div>

<button class="settings-button" (click)="toggleSettings()">
    <img src="./assets/ui/settings.png">
</button>
@if (isSettingsClicked) {
    <app-pop-up [popUpMessage]="title" 
    [description]="description"
    [showSecondButton]="true" 
    (confirm)="toggleSettings()"
    (cancel)="quitGame()"
    [firstOption]="'game_info.continue' | translate"
    [secondOption]="'game_info.quit' | translate"></app-pop-up>
}

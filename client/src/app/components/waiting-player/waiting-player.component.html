@if (showError===true) {
    <app-pop-up
        popUpMessage="{{errorMessage}}"
        [showSecondButton]="false"
        (confirm)="router.navigate(['/home'])">
    </app-pop-up>
}   

<div class="waiting-room-container">
    <div class="header">
        <button class="return-button" (click)="leaveRoom()">
            <img src="./assets/ui/left.png">
            <span class="return-btn-txt">Quitter la partie</span>
        </button>
        <h1 class="title">Bienvenue dans la salle d'attente !</h1>
    </div>
    <div class="players-container">
        @for (player of room?.players; track player.id) {
            <app-player-card [showKick]="isHost && player.id !== room?.organisatorId"
                [isHost]="player.id === room?.organisatorId"
                [player]="player"
                (banEvent)="kickPlayer($event)">
            </app-player-card>
        }
    </div>
    <div class="chat-container">
        <app-chatbox></app-chatbox>
    </div>
    <div class="game-info">
        <h3>Code de la partie :</h3>
        <h1>{{ code }}</h1>
    </div>
    @if(isHost) {
    <div class="host-options">
        <button class="lock-btn" (click)="toggleLockRoom()">
            {{ room?.isLocked ? 'Déverrouiller la salle' : 'Verrouiller la salle' }}
        </button>
        <button class="startGame-btn" [class.isClickable]="room?.isLocked && room?.players!.length > 1" (click)="startGame()">Commencer la partie</button>
    </div>
    } @else {
    <div class="waiting-msg">En attente de l'organisateur de la partie...</div>
    }
</div>

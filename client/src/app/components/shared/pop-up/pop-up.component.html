<div class="dialogue">
    <div class="errors" [class.error-popup]="isError">
        <h2>{{ popUpMessage }}</h2>
        @if(description) {
        <h3> {{description}}</h3>
        }
        <div class="buttons">
            @if (items.length === 0) {
            <button (click)="onConfirm()">{{firstOption}}</button>
            }
            @if(showSecondButton) {
                <button (click)="onCancel()">{{secondOption}}</button>
                }
        </div>
        <div class="item-options">
            @for (item of items; track item) {
            <button (click)="onSelect(item)">
                {{ ('items_names.' + item.type) | translate }}
            </button>
            }
        </div>
    </div>
</div>

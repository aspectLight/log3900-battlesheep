<div class="chatbox" [class.collapsed]="isCollapsed">
    <div class="chatbox-header">
        <!-- Sélecteur de canal (uniquement en mode GeneralChat) -->
        @if (roomType === 'GeneralChat') {
            <select class="channel-select" [ngModel]="activeChannelId" (ngModelChange)="switchChannel($event)">
                <option [ngValue]="null">Général</option>
                @for (ch of joinedChannelInfos; track ch.id) {
                    <option [ngValue]="ch.id">{{ ch.name }}</option>
                }
            </select>
        } @else {
            <h3>Chat</h3>
        }
        <div class="header-buttons">
            <div class="toggle-button" (click)="toggleChatbox()">
                @if (isCollapsed) {
                    <span>▼</span>
                } @else {
                    <span>▲</span>
                }
            </div>
        </div>
    </div>

    <div class="chatbox-content" [class.hidden]="isCollapsed">
        <div class="chatbox-messages" #chatboxMessages>
            @for (msg of displayMessages; track $index) {
                <div class="message">
                    <span class="msg-time">{{ msg.time }}</span>
                    <span class="msg-author">{{ msg.name }}</span>
                    <span class="msg-content">{{ msg.content }}</span>
                </div>
            }
        </div>

        <div class="chatbox-input">
            <input
                #messageInput
                type="text"
                maxlength="200"
                [placeholder]="activeChannelId ? ('Écrire dans #' + activeChannelLabel + '...') : 'Écrire un message...'"
                [(ngModel)]="newMessage"
                (keydown.enter)="sendMessage()"
            />
            <button (click)="sendMessage()" class="square-button">Envoyer</button>
        </div>
    </div>
</div>

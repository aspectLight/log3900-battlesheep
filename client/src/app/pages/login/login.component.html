<div class="container">
    <button class="return-button" routerLink="/auth-landing" type="button">
        <img src="./assets/ui/left.png" alt="Back" />
        Retour
    </button>

    <div class="content-wrapper">
        <img class="logo" src="./assets/ui/eastern_solace_logo-removebg-preview.png" alt="Logo Jeu" />
        <form [formGroup]="form" (ngSubmit)="submitForm()" class="login-form">
            <div class="field">
                <label for="username">Pseudonyme</label>
                <input id="username" type="text" formControlName="username" autocomplete="username" placeholder="JohnDoe" />

                @if (form.controls.username.touched && form.controls.username.errors?.['required']) {
                <small class="error">Champ obligatoire</small>
                }
            </div>

            <div class="field">
                <label for="password">Mot de passe</label>
                <div class="password-wrapper">
                    <input
                        id="password"
                        [type]="showPassword ? 'text' : 'password'"
                        formControlName="password"
                        autocomplete="current-password"
                        placeholder="••••••••"
                    />
                    <button type="button" class="toggle-password" (click)="togglePasswordVisibility()" tabindex="-1">
                        @if (showPassword) {
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="20"
                            height="20"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        } @else {
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="20"
                            height="20"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path
                                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
                            ></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                        }
                    </button>
                </div>

                @if (form.controls.password.touched && form.controls.password.errors?.['required']) {
                <small class="error">Champ obligatoire</small>
                }
            </div>

            <div class="form-actions">
                <!-- Backend error message -->
                @if (errorMessage) {
                <div class="form-error">{{ errorMessage }}</div>
                }

                <button type="submit" class="btn-primary" [disabled]="isSubmitting">
                    {{ isSubmitting ? 'Connexion...' : 'Se connecter' }}
                </button>

                <p class="register-link">
                    Pas encore de compte ?
                    <a routerLink="/register">S'inscrire</a>
                </p>
            </div>
        </form>
    </div>
</div>

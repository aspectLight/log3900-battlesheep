@if (isGameCanceled) {
    <app-pop-up popUpMessage="Partie annulée par manque de joueurs" 
    description=""
    [showSecondButton]="false" 
    (confirm)="understandError()"
    firstOption="Compris"></app-pop-up>
}

@if (isGameFinished) {
    <app-pop-up popUpMessage="Partie terminé, limite de 3 victoires atteintes par un personnage" 
    description=""
    [showSecondButton]="false" 
    (confirm)="understandMessage()"
    firstOption="Compris"></app-pop-up>
}


<div class="container justified">
    <div class="background-overlay"></div>
    <h1 class="header-item"></h1>
    <img style="max-width: 350px; height: auto;" src="./assets/ui/eastern_solace_logo-removebg-preview.png" alt="Logo Jeu" />
    <section id="play-option" class="justified">
        <div class="justified">
            <button class="button" id="join-game-button" routerLink="/join-game">Joindre une partie</button>
            <button class="button" id="create-game-button" routerLink="/create-game">Créer une partie</button>
            <button class="button" id="admin-game-button" routerLink="/admin-game">Administrer les jeux</button>
        </div>
    </section>

    <footer class="footer-item">
        <h4 class="team-name">Équipe 212</h4>
        <p>
            <span>Fares Laadjel</span>, <span>Anis Gadouche</span>, <span>Ayoub Marfouk</span>, 
            <span>Pierre Carré</span>, <span>Chems-Eddine Kardoussi</span>, <span>Anas Chati</span>
        </p>
    </footer>
</div>
